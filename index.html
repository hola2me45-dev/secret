*{box-sizing:border-box;margin:0;padding:0}
:root{
--ink:#080D22;--ash:#101833;--ash2:#16203F;--ash3:#1F2B50;--line:#2C3A63;
--text:#EAEEFB;--dim:#94A0C6;--acc:#FBB040;--accG:rgba(251,176,64,.5);--ember:#F5793B;--ember2:#FBB040;
--magenta:#E8437A;--coral:#F0576B;--teal:#35BFAE;--violet:#6C6BD8;
--vzY:#F5DE20;--vzB:#1E35F8;--vzR:#F52026;
--grape:#874CB9;--plum:#A22E9F;--fuchsia:#BA318A;--rose:#E34D96;--peach:#F49A6E;
--red:#E8412F;--blue:#4A72E8;--ok:#35BFAE;
--flame:linear-gradient(180deg,#FBB040 0%,#F38968 38%,#E34D96 72%,#A22E9F 100%);
--display:"Dreaming Outloud","Poppins",system-ui,sans-serif;
--body:"Poppins",ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
--mono:"Poppins",ui-sans-serif,system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:var(--display);cursor:pointer;border:0;color:inherit;background:none;letter-spacing:.06em}
select,input{font-family:var(--body);color:var(--text);background:var(--ash2);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:13px;width:100%}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

#menu{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;
background:radial-gradient(80% 55% at 12% 8%,#F2625A 0%,rgba(242,98,90,0) 62%),
radial-gradient(75% 55% at 92% 14%,#F49A6E 0%,rgba(244,154,110,0) 58%),
radial-gradient(95% 60% at 80% 52%,#E34D96 0%,rgba(227,77,150,0) 62%),
radial-gradient(90% 60% at 8% 62%,#A22E9F 0%,rgba(162,46,159,0) 66%),
radial-gradient(110% 70% at 50% 108%,#5B2E9E 0%,rgba(91,46,158,0) 70%),
linear-gradient(165deg,#B7379A 0%,#8E3AAE 45%,#5C33A0 100%);text-align:center;z-index:30}

#menu h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,6.4vw,64px);line-height:.98;letter-spacing:.02em;text-transform:uppercase}
#menu h1 .byline{display:block;font-size:clamp(13px,1.9vw,20px);letter-spacing:.34em;color:rgba(255,255,255,.9);margin-top:6px;text-transform:lowercase;font-weight:400;text-shadow:0 2px 10px rgba(40,8,60,.5)}
#menu h1 em{font-style:normal;display:block;color:#fff;
text-shadow:0 3px 0 rgba(90,20,110,.35),0 10px 30px rgba(50,10,70,.45)}
#menu .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase}
#logoBox{width:min(78vw,360px);padding:16px 20px;border:2px solid transparent;border-radius:16px;display:flex;align-items:center;justify-content:center;
background:linear-gradient(160deg,#0B1027,#070B1C) padding-box,linear-gradient(150deg,#FBB040,#E34D96 50%,#874CB9) border-box;
box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden}
#logoBox img{width:100%;height:auto;display:block}
#logoBox span{font-family:var(--display);letter-spacing:.16em;font-size:15px;color:var(--dim);text-transform:uppercase}
.vzBar{position:absolute;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);display:flex;height:5px;pointer-events:none}
.vzBar i{flex:1;box-shadow:0 -6px 20px rgba(0,0,0,.45)}
.vzBar i:nth-child(1){background:var(--vzY)}
.vzBar i:nth-child(2){background:var(--vzB)}
.vzBar i:nth-child(3){background:var(--vzR)}
.menuBtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;flex-direction:column;align-items:center}
.modePick{display:flex;align-items:stretch;gap:8px;width:min(88vw,332px)}
.helpBtn{width:52px;border-radius:14px;font-family:var(--display);font-size:21px;font-weight:700;
background:linear-gradient(180deg,rgba(46,56,84,.95),rgba(19,25,41,.95));border:1px solid rgba(251,176,64,.35);color:var(--ember2);
box-shadow:0 12px 28px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.10);transition:transform .14s,border-color .14s,color .14s}
.helpBtn:hover{transform:translateY(-2px);border-color:var(--ember2);color:#fff}
.bigBtn{position:relative;flex:1 1 auto;min-width:0;padding:16px 22px 16px 30px;border-radius:14px;
font-size:clamp(13px,3.7vw,16px);text-align:center;
text-transform:uppercase;font-weight:700;letter-spacing:.08em;color:#F4F7FF;
background:linear-gradient(180deg,rgba(46,56,84,.95),rgba(19,25,41,.95));
border:1px solid transparent;
background-origin:border-box;
background-clip:padding-box,border-box;
background-image:linear-gradient(180deg,rgba(46,56,84,.95),rgba(19,25,41,.95)),linear-gradient(120deg,rgba(251,176,64,.55),rgba(227,77,150,.6) 52%,rgba(135,76,185,.6));
box-shadow:0 12px 28px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.10);
transition:transform .14s ease,box-shadow .14s ease,filter .14s ease}
.bigBtn::before{content:"";position:absolute;left:14px;top:50%;transform:translateY(-50%);
width:7px;height:7px;border-radius:50%;background:linear-gradient(120deg,#F5DE20,#E34D96);
box-shadow:0 0 10px rgba(245,121,59,.8)}
.bigBtn:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(0,0,0,.6),0 0 0 1px rgba(251,176,64,.35),inset 0 1px 0 rgba(255,255,255,.14);filter:brightness(1.07)}
.bigBtn:active{transform:translateY(0)}
#menu .foot{font-size:11px;color:var(--dim);letter-spacing:.12em}
.langRow{display:flex;gap:8px;padding:5px;border-radius:26px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.langBtn{padding:8px 15px;border-radius:22px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);transition:.15s}
.langBtn.sel{background:linear-gradient(120deg,#F5DE20,#F38968 45%,#E34D96);color:#2A0A16;font-weight:700}

#app{display:none;height:100%;width:100%}

const LS_CFG='ig_config_v2',LS_LIB='ig_library_v2',LS_LANG='ig_lang_v1',LS_LAY='ig_layout_v1',LS_PAN='ig_panel_v1';
let lsOK=true;
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){lsOK=false;return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){lsOK=false;return false}}
function saveConfig(){
const st=S.strat;
lsSet(LS_CFG,{alianza:S.alliance,archivo:st.fileName||'',
robots:st.robots.map(r=>({name:r.name,flag:FLAGS[r.flag%FLAGS.length].n,target:r.target,tarea:r.tarea||'',climbAt:r.climbAt})),
plan:st.plan.slice(),
juego:{p1:S.game.p1,players:S.game.players,p2Ally:S.game.p2Ally,p1Name:S.game.p1Name,p2Name:S.game.p2Name,
p1Flag:FLAGS[S.game.p1Flag%FLAGS.length].n,p2Flag:FLAGS[S.game.p2Flag%FLAGS.length].n}});
}
function loadConfig(){
const c=lsGet(LS_CFG);if(!c)return false;
if(c.alianza==='red'||c.alianza==='blue')S.alliance=c.alianza;
resetStrategyRobots();
const st=S.strat;
st.fileName=c.archivo||'';
if(Array.isArray(c.robots))c.robots.slice(0,3).forEach((rb,i)=>{
const r=st.robots[i];
r.name=rb.name||r.name;r.flag=flagIdx(rb.flag);r.target=rb.target||r.target;
r.tarea=rb.tarea||'';if(rb.climbAt)r.climbAt=+rb.climbAt;
});
if(Array.isArray(c.plan)&&c.plan.length===3)st.plan=c.plan.slice();
if(c.juego){
const j=c.juego;
if(j.p1==='red'||j.p1==='blue')S.game.p1=j.p1;
if(j.players)S.game.players=j.players;
S.game.p2Ally=!!j.p2Ally;
S.game.p1Name=j.p1Name||S.game.p1Name;S.game.p2Name=j.p2Name||S.game.p2Name;
S.game.p1Flag=flagIdx(j.p1Flag);S.game.p2Flag=flagIdx(j.p2Flag);
}
return true;
}
function library(){const l=lsGet(LS_LIB);return Array.isArray(l)?l:[]}
function libSave(list){return lsSet(LS_LIB,list)}
function saveToLibrary(name){
const list=library();
list.unshift({id:Date.now(),nombre:name,fecha:new Date().toISOString().slice(0,16).replace('T',' '),data:strategyData()});
while(list.length>40)list.pop();
return libSave(list);
}
function safeName(n){return (n||'estrategia').replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,'_').slice(0,60)}
function downloadJSON(obj,name){
const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
const a=document.createElement('a');
a.href=URL.createObjectURL(blob);a.download=safeName(name)+'.json';a.click();
setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
const IMG={};
let USE_IMG_SKIN=false;
function loadImage(key,src){return new Promise(r=>{const i=new Image();i.onload=()=>{IMG[key]=i;r(true)};i.onerror=()=>r(false);i.src=src})}

let FLAGS=FLAGS_FALLBACK.slice();
function flagIdx(name){const i=FLAGS.findIndex(f=>f.n===name);return i<0?0:i}
const USE_FLAG_FILES=false,LOCAL_ASSETS=false;
async function loadFlagManifest(){
if(!USE_FLAG_FILES)return;
try{
const r=await fetch('flags/manifest.json',{cache:'no-store'});
if(!r.ok)return;
const list=await r.json();
if(!Array.isArray(list)||!list.length)return;
const out=[];
for(const f of list){
const name=String(f).replace(/\.[^.]+$/,'').replace(/[_-]/g,' ');
const ok=await loadImage('flag:'+f,'flags/'+f);
out.push({n:name,c:['#5A544B','#7C7568','#5A544B'],file:ok?f:null});
}
if(out.length)FLAGS=out;
}catch(e){}
}

let W=DEFAULT_FIELD,H=DEFAULT_FIELD,SPEED=W/5,RSIZE=W*0.068,INTAKE_R=W*0.0286,BALL_R=W*0.0072;
const cv=document.getElementById('cv');

cv.width=W;cv.height=H;

function R(k){const f=FIELD_LAYOUT[k];return{x:f.x*W,y:f.y*H,w:f.w*W,h:f.h*H}}
function inRect(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h}
function nearRect(x,y,r,m){return x>=r.x-m&&x<=r.x+r.w+m&&y>=r.y-m&&y<=r.y+r.h+m}
function brace(side){const b=FIELD_LAYOUT.braces[side];return{ax:b.x1*W,ay:b.y1*H,bx:b.x2*W,by:b.y2*H}}
function bracePoint(side,t){const b=brace(side);return{x:b.ax+(b.bx-b.ax)*t,y:b.ay+(b.by-b.ay)*t}}
function bracePos(side,t,lane){
return bracePoint(side,clamp(t+(lane||0)*0.078,0.02,0.99));
}
function partnerLanes(){
const g=S.game;
g.robots.forEach(r=>{r.pT=null;r.pLane=null});
if(g.players!==2)return;
['red','blue'].forEach(a=>{
const list=g.robots.filter(r=>r.onBrace&&r.alliance===a);
const top=list.filter(r=>zoneOf(r.climbT)==='ZONE3').sort((x,y)=>x.climbStart-y.climbStart);
if(!top.length)return;
const held=list.filter(r=>{const z=zoneOf(r.climbT);return z==='ZONE1'||z==='ZONE2'});
held.forEach((r,i)=>{
const c=top[i%top.length];
r.pT=c.climbT;
r.pLane=(c.lane||0)+((i%2)?-1:1)*(Math.floor(i/2)+1);
});
});
}
function laneGroup(arr,key){
const gr={};
arr.forEach(r=>{const k=key(r);(gr[k]=gr[k]||[]).push(r)});
Object.keys(gr).forEach(k=>gr[k].forEach((r,i)=>r.lane=(gr[k].length-1)/2-i));
}
function distToBrace(side,x,y){
const b=brace(side),dx=b.bx-b.ax,dy=b.by-b.ay,L=dx*dx+dy*dy;
let t=((x-b.ax)*dx+(y-b.ay)*dy)/L;t=Math.max(0,Math.min(1,t));
return{d:Math.hypot(x-(b.ax+dx*t),y-(b.ay+dy*t)),t:t}
}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function fmt(t){t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0')}
function zoneOf(t){return t<=1/3?'ZONE1':t<=2/3?'ZONE2':'ZONE3'}
function bnd(){return R('bounds')}

function zoneSlot(alliance,i){
const z=R(alliance==='red'?'regionalZoneRed':'regionalZoneBlue');
return{x:z.x+z.w/2,y:z.y+z.h*(i+0.5)/3}
}
function newStratRobot(i){
const p=zoneSlot(S.alliance,i);
return{name:'Robot '+(i+1),flag:flagIdx('Venezuela'),x:p.x,y:p.y,angle:Math.PI/2,route:[],target:'ZONE1',tarea:'',climbAt:[30,22,14][i]||20,cT:null,done:false}

function makeRefBalls(){
const b=bnd(),arr=[];
for(let i=0;i<250;i++){
const a=Math.random()*Math.PI*2,rr=Math.pow(Math.random(),0.62)*W*0.155;
arr.push({x:clamp(b.x+b.w*0.5+Math.cos(a)*rr,b.x+BALL_R,b.x+b.w-BALL_R),
y:clamp(b.y+b.h*0.54+Math.sin(a)*rr*0.92,b.y+BALL_R,b.y+b.h-BALL_R)});
}
return arr;
}
function switchAlliance(a){
const st=S.strat;
if(S.alliance===a)return;
S.alliance=a;
const mx=v=>W-v;
st.robots.forEach(r=>{
r.x=mx(r.x);
r.angle=Math.PI-r.angle;
if(r.route&&r.route.length)r.route=r.route.map(p=>({t:p.t,x:+(1-p.x).toFixed(4),y:p.y}));
});
if(st.home&&st.home.length)st.home=st.home.map(h=>h?{x:mx(h.x),y:h.y,a:Math.PI-h.a}:h);
}
function resetStrategyRobots(){
if(!S.strat.refBalls||!S.strat.refBalls.length)S.strat.refBalls=makeRefBalls();

S.strat.plan=[0,1,2];S.strat.phase='idle';
}

function newBall(){

function stepStrategy(dt,now){
const st=S.strat;
if(st.phase==='play'){
const el0=(now-st.playStart)/1000;
let any=false;
st.robots.forEach(r=>{
if(!r.route.length)return;
const end=r.route[r.route.length-1];
if(el0<=end.t)any=true;
let i=0;while(i<r.route.length-1&&r.route[i+1].t<el0)i++;
const a=r.route[i],b=r.route[Math.min(i+1,r.route.length-1)];
const k=b.t>a.t?clamp((el0-a.t)/(b.t-a.t),0,1):0;
const nx=(a.x+(b.x-a.x)*k)*W,ny=(a.y+(b.y-a.y)*k)*H;
if(Math.hypot(nx-r.x,ny-r.y)>1.2)r.angle=Math.atan2(ny-r.y,nx-r.x);
r.x=nx;r.y=ny;
});
if(!any)startClimbAnim();
return;
}
if(st.phase==='climb'){
st.cClock-=dt;
const side=S.alliance;
const pair=partnerPair(st);
let allDone=true;
st.plan.forEach(ri=>{
const r=st.robots[ri];
if(r.done)return;
allDone=false;
if(st.cClock>r.climbAt)return;
if(pair&&r===pair.d){
const u=pair.u,o=pcOffset(u);
const tx=u.x+o.x,ty=u.y+o.y;
if(!r.pcHook){
const dx0=tx-r.x,dy0=ty-r.y,dd=Math.hypot(dx0,dy0);
if(dd<5){r.pcHook=true;r.angle=u.angle}
else{const v0=Math.min(SPEED*0.85*dt,dd);r.x+=dx0/dd*v0;r.y+=dy0/dd*v0;r.angle=Math.atan2(dy0,dx0)}
}else{
r.x=tx;r.y=ty;r.angle=u.angle;
if(u.done)r.done=true;
}
return;
}
if(r.cT===null||r.cT===undefined){
const p=bracePos(side,0.20,r.lane);
const dx=p.x-r.x,dy=p.y-r.y,d=Math.hypot(dx,dy);
if(d<4){
if(r.target==='CONTACT')r.done=true;
else if(!pair||r!==pair.u||pair.d.pcHook)r.cT=0.20;
}
else{const v=Math.min(SPEED*0.85*dt,d);r.x+=dx/d*v;r.y+=dy/d*v;r.angle=Math.atan2(dy,dx)}
}else{
const goal=TARGET_T[r.target]||0.26;
r.cT=Math.min(goal,r.cT+dt*0.22);
const p=bracePos(side,r.cT,r.lane);r.x=p.x;r.y=p.y;
const b=brace(side);r.angle=Math.atan2(b.by-b.ay,b.bx-b.ax);
if(r.cT>=goal-0.001)r.done=true;
}
});
if(allDone&&st.cClock<=0){
st.cWait-=dt;
if(st.cWait<=0){resetToHome();st.phase='idle';renderPanel()}
}
return;
}
}
function partnerPair(st){
const on=(st.robots||[]).filter(r=>r.pcOn);
if(on.length!==2)return null;
const u=on.filter(r=>r.pcRole==='up')[0],d=on.filter(r=>r.pcRole==='down')[0];
if(!u||!d)return null;
return{u:u,d:d};
}
function pcOffset(u){
const a=(u.angle||0)+Math.PI/2;
return{x:Math.cos(a)*RSIZE*0.92,y:Math.sin(a)*RSIZE*0.92};
}

const st=S.strat;

function stepGame(dt){

['red','blue'].forEach(a=>laneGroup(g.robots.filter(r=>r.onBrace&&r.alliance===a).sort((x,y)=>x.climbStart-y.climbStart),r=>zoneOf(r.climbT)));

function stepBalls(dt){
const g=S.game,bb=bnd(),damp=Math.exp(-dt);
for(let i=0;i<g.balls.length;i++){
const b=g.balls[i];
if(!b.live||(b.vx===0&&b.vy===0))continue;
b.x+=b.vx*dt;b.y+=b.vy*dt;
const k=Math.pow(damp,b.damp);
b.vx*=k;b.vy*=k;
if(b.x<bb.x+BALL_R){b.x=bb.x+BALL_R;b.vx=-b.vx*0.45}
if(b.x>bb.x+bb.w-BALL_R){b.x=bb.x+bb.w-BALL_R;b.vx=-b.vx*0.45}
if(b.y<bb.y+BALL_R){b.y=bb.y+BALL_R;b.vy=-b.vy*0.45}
if(b.y>bb.y+bb.h-BALL_R){b.y=bb.y+bb.h-BALL_R;b.vy=-b.vy*0.45}
for(let s=0;s<SOLIDS.length;s++){
const r=R(SOLIDS[s]);
if(b.x>r.x-BALL_R&&b.x<r.x+r.w+BALL_R&&b.y>r.y-BALL_R&&b.y<r.y+r.h+BALL_R){
const dl=b.x+BALL_R-r.x,dr=r.x+r.w-(b.x-BALL_R),dt2=b.y+BALL_R-r.y,db=r.y+r.h-(b.y-BALL_R);
const m=Math.min(dl,dr,dt2,db);
if(m===dl){b.x=r.x-BALL_R;b.vx=-Math.abs(b.vx)*0.4}
else if(m===dr){b.x=r.x+r.w+BALL_R;b.vx=Math.abs(b.vx)*0.4}
else if(m===dt2){b.y=r.y-BALL_R;b.vy=-Math.abs(b.vy)*0.4}
else{b.y=r.y+r.h+BALL_R;b.vy=Math.abs(b.vy)*0.4}
}
}
if(Math.abs(b.vx)<2&&Math.abs(b.vy)<2){b.vx=0;b.vy=0}
}
}

function pushBalls(r){
const g=S.game,rad=INTAKE_R*0.72;
for(let i=0;i<g.balls.length;i++){
const b=g.balls[i];if(!b.live)continue;
const dx=b.x-r.x,dy=b.y-r.y,d=Math.hypot(dx,dy);
if(d<rad&&d>0.001){
const k=(rad-d)/d;
b.x+=dx*k;b.y+=dy*k;
b.vx+=dx*k*2;b.vy+=dy*k*2;
}
}
}
function scoreSpot(r){
const su=R(r.alliance==='red'?'suppressionRed':'suppressionBlue');
if(nearRect(r.x,r.y,su,RSIZE*0.72))return 'sup';
if(nearRect(r.x,r.y,ownShield(r),RSIZE*0.72))return 'ext';
return null;
}
function doAction(r){
const g=S.game;
if(r.onBrace)return;
if(r.mode!=='SHOOT'){
if(r.balls>=MAX_BALLS)return;
let best=-1,bd=INTAKE_R;
for(let i=0;i<g.balls.length;i++){
const b=g.balls[i];if(!b.live)continue;
const d=Math.hypot(b.x-r.x,b.y-r.y);
if(d<bd){bd=d;best=i}
}
if(best>=0){g.balls[best].live=false;g.live--;r.balls++}
return;
}
if(r.balls<=0)return;
const spot=scoreSpot(r);
if(spot==='sup'){
r.balls--;g.score[r.alliance]++;
const su=R(r.alliance==='red'?'suppressionRed':'suppressionBlue');
addShot(r.x,r.y,su.x+su.w*(0.3+Math.random()*0.4),su.y+su.h*0.55,r.alliance==='red'?'#FF8E86':'#9E9DF0',false);
r.flash=0.16;
}else if(spot==='ext'){
r.balls--;g.hp[r.alliance].q++;
const f=ownShield(r);
addShot(r.x,r.y,f.x+f.w*(0.3+Math.random()*0.4),f.y+f.h*0.45,'#FBB040',false);
r.flash=0.16;
}
}
function humanControl(r,dt){
const p=pads[r.human],mag=Math.hypot(p.ax,p.ay);

else{r.climbT=Math.max(0.03,r.climbT-dt*CLIMB_DECAY);r.vx=0;r.vy=0;return}
}
r.vx=p.ax*SPEED*HUMAN_BOOST;r.vy=p.ay*SPEED*HUMAN_BOOST;
}
function cpuThink(r,dt){
const g=S.game;
if(bracesVisible()){
const want=r.idx===0?0.90:r.idx===1?0.58:0.26;
if(r.onBrace){
const a=climbAhead(r);r.block=a;
r.climbT=Math.min(want,r.climbT+dt*0.15*climbFactor(a));
r.vx=0;r.vy=0;return;
}
const q=distToBrace(r.alliance,r.x,r.y);
if(q.d<RSIZE*0.8&&q.t<0.32){r.onBrace=true;r.climbT=Math.max(q.t,0.05);r.climbStart=g.t;return}
const p=bracePoint(r.alliance,0.20);
driveTo(r,p.x,p.y);r.mode='SHOOT';return;
}
if(r.balls>=MAX_BALLS||(r.goal==='score'&&r.balls>0)){
r.goal='score';r.mode='SHOOT';
if(r.idx===2){
const fs=R(r.alliance==='red'?'fireShieldRed':'fireShieldBlue');
driveTo(r,fs.x+fs.w/2,fs.y-RSIZE*0.55);
}else{
const su=R(r.alliance==='red'?'suppressionRed':'suppressionBlue');
driveTo(r,su.x+su.w/2,su.y+su.h+RSIZE*0.55);
}
if(r.balls===0)r.goal='collect';
return;
}
r.goal='collect';r.mode='INTAKE';
let best=null,bd=1e9;
for(let i=r.idx;i<g.balls.length;i+=3){
const b=g.balls[i];if(!b.live)continue;
const d=Math.hypot(b.x-r.x,b.y-r.y);

}
if(best)driveTo(r,best.x,best.y);else{r.vx=0;r.vy=0}
}

if(d<3){r.vx=0;r.vy=0;return}
r.vx=dx/d*SPEED*0.9;r.vy=dy/d*SPEED*0.9;
}

function startRec(){
const st=S.strat;
st.robots.forEach((r,i)=>{
r.route=[];
const p0=zoneSlot(S.alliance,i);
r.x=p0.x;r.y=p0.y;
r.angle=S.alliance==='red'?0:Math.PI;
r.cT=null;r.done=false;r.lane=0;
});
st.recording=true;st.recStart=performance.now();st.phase='idle';
st.recTimer=setInterval(()=>{
const el1=(performance.now()-st.recStart)/1000;
if(el1>MATCH_TIME){stopRec();return}
st.robots.forEach(r=>r.route.push({t:+el1.toFixed(2),x:+(r.x/W).toFixed(4),y:+(r.y/H).toFixed(4)}));
},100);
renderPanel();
}
function stopRec(){
const st=S.strat;
clearInterval(st.recTimer);st.recTimer=null;st.recording=false;renderPanel();openTasks();
}
function strategyData(){
const st=S.strat;
return{
alianza:S.alliance,
nombre:st.fileName||'',
robots:st.robots.map(r=>({nombre:r.name,bandera:FLAGS[r.flag%FLAGS.length].n,ruta:r.route,tarea:r.tarea||''})),
planEscalada:{orden:st.plan.map(i=>st.robots[i].name),zonasObjetivo:st.plan.map(i=>st.robots[i].target),segundosRestantes:st.plan.map(i=>st.robots[i].climbAt)}
};
}
function exportJSON(){
downloadJSON(strategyData(),S.strat.fileName||('estrategia_'+S.alliance));
}
function importJSON(d){
const st=S.strat;
if(d.alianza==='red'||d.alianza==='blue')S.alliance=d.alianza;
resetStrategyRobots();
st.fileName=d.nombre||st.fileName;
if(Array.isArray(d.robots)){
d.robots.slice(0,3).forEach((rb,i)=>{
const r=st.robots[i];
r.name=rb.nombre||r.name;
const fi=FLAGS.findIndex(f=>f.n===rb.bandera);
r.flag=fi>=0?fi:r.flag;
r.route=Array.isArray(rb.ruta)?rb.ruta:[];
r.tarea=rb.tarea||'';
if(r.route.length){r.x=r.route[0].x*W;r.y=r.route[0].y*H}
});
}
if(d.planEscalada){
const ord=d.planEscalada.orden||[],zn=d.planEscalada.zonasObjetivo||[],tm=d.planEscalada.segundosRestantes||[];
const plan=[];
ord.forEach(n=>{const i=st.robots.findIndex(r=>r.name===n);if(i>=0&&!plan.includes(i))plan.push(i)});
[0,1,2].forEach(i=>{if(!plan.includes(i))plan.push(i)});
st.plan=plan;
plan.forEach((ri,k)=>{if(zn[k])st.robots[ri].target=zn[k];if(tm[k])st.robots[ri].climbAt=+tm[k]});
}
st.tab='equipo';saveConfig();renderPanel();openTasks();
}

const btnHide=document.getElementById('btnHide'),btnShow=document.getElementById('btnShow');
let panelPref=true,panelAuto=false;
function setPanel(open,persist){
document.body.classList.toggle('nopanel',!open);
if(persist!==false){panelPref=open;lsSet(LS_PAN,open?1:0)}
}
function autoHidePanel(){
if(panelAuto)return;
panelAuto=true;
setPanel(false,false);
}
function autoShowPanel(){
if(!panelAuto)return;
panelAuto=false;
setPanel(panelPref,false);

function renderTasks(){

tbBody.innerHTML='';
st.plan.forEach((ri,pos)=>{

const box=el('div','tk');
box.innerHTML='<div class="hd">'+chipHTML(r.flag)+'<span class="nm">'+r.name+'</span><span class="ord">'+ordLabel(pos)+' '+t('toClimb')+'</span></div>'+
'<div class="t1"><b>'+t('task1')+'</b> '+t('t1a')+fmt(r.climbAt)+t('t1b')+ordLabel(pos)+t('t1c')+r.target+'</b>'+
(pos===0?t('t1first'):pos===st.plan.length-1?t('t1last'):t('t1mid'))+'</div>'+
'<div class="cap">'+t('task2')+'</div>';
const ta=el('textarea');
ta.placeholder=t('phTask');
ta.value=r.tarea||'';
ta.oninput=()=>{r.tarea=ta.value;saveConfig()};
box.appendChild(ta);
tbBody.appendChild(box);
});
}

const keys={};
function pressAct(n){
const r=humanRobot(n);if(!r)return;
if(canClimb(r))climbTap(r);else cycleMode(r);
updateActBtn();
}
addEventListener('keydown',e=>{
const k=e.key.toLowerCase();
if(keys[k])return;
keys[k]=true;
if(S.mode!=='game'||S.game.phase==='setup')return;
if(e.key===' '){e.preventDefault();pressAct(1)}
if(k==='q')pressAct(2);
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
setInterval(()=>{
if(S.mode!=='game'||S.game.phase==='setup')return;
const k1x=(keys['arrowright']?1:0)-(keys['arrowleft']?1:0);
const k1y=(keys['arrowdown']?1:0)-(keys['arrowup']?1:0);
const k2x=(keys['d']?1:0)-(keys['a']?1:0);
const k2y=(keys['s']?1:0)-(keys['w']?1:0);
if(pads[1].id===null){
if(k1x||k1y){const m=Math.hypot(k1x,k1y);pads[1].ax=k1x/m;pads[1].ay=k1y/m}
else if(!keys['arrowup']&&!keys['arrowdown']&&!keys['arrowleft']&&!keys['arrowright']){pads[1].ax=0;pads[1].ay=0}
}
if(pads[2].id===null){
if(k2x||k2y){const m=Math.hypot(k2x,k2y);pads[2].ax=k2x/m;pads[2].ay=k2y/m}
else if(!keys['w']&&!keys['a']&&!keys['s']&&!keys['d']){pads[2].ax=0;pads[2].ay=0}
}
},40);

const TOUR_TXT={"es": {"skip": "Saltar", "done": "Empezar", "g": [["Cuántos juegan", "Elige <b>1 jugador</b> contra cinco CPU, o <b>2 jugadores</b> en la misma pantalla. Con dos, luego decides si van <b>aliados</b> (mismo color) o <b>rivales</b>."], ["Tu alianza", "Aquí eliges si juegas en <b>rojo o azul</b>. Descargarás en la Suppression Unit de tu color y treparás tu propio brace."], ["Tu país y tu nombre", "Escribe el nombre de tu equipo y busca tu país escribiendo. La <b>bandera aparecerá sobre tu robot</b> en la cancha para que lo reconozcas al instante."], ["Empieza el partido", "Este botón lanza la partida: cuenta atrás de 3, las Wildfire salen rodando del Extinguisher y arrancan los <b>2:30</b>."], ["El reloj y el marcador", "Aquí sigues el <b>tiempo</b>, los puntos de cada alianza y los del <b>Extinguisher</b>, que son globales: suman a los dos bandos por igual."], ["Conducir, recoger y disparar", "Con el <b>joystick</b> te mueves y el robot gira hacia donde apuntas. El <b>botón grande</b> fija el modo: <b>INTAKE</b> recoge del suelo (3/s, tope 25) y <b>SHOOT</b> descarga pegado a tu Suppression Unit."], ["El Fire Shield", "Pegado a <b>tu</b> Fire Shield el botón añade un modo más: SHOOT deposita ahí y tu human player las lanza al Extinguisher, y <b>CARGAR</b> te devuelve 6 pelotas cada 2 s. El shield del rival no te sirve de nada."], ["Trepar al brace", "En los <b>últimos 30 s</b> aparecen los braces. Acércate a la ZONE 1 del tuyo y <b>pulsa TREPAR muchas veces seguidas</b>. Si dejas de pulsar resbalas; si mueves el joystick te sueltas. Cuanto más alto llegues, mayor el multiplicador para tu alianza."], ["Cuidado con la cola", "El brace es <b>compartido por los tres robots</b> de tu alianza. Si subes con el brace libre, avanzas normal. Con <b>un robot por delante cuesta el doble</b> de toques, y con <b>dos, más del triple</b>: tienes que abrirte paso. La barra bajo tu robot se pone ámbar o roja y marca <b>x2</b> o <b>x3</b> para avisarte. Por eso conviene decidir antes quién sube primero y no amontonarse."], ["Se acabó el tiempo", "Al llegar a 0:00 hay <b>5 s de asentamiento</b>: ya <b>no puedes trepar más</b> y cuenta la posición en la que quedaste. Luego aparece el <b>resultado sobre la cancha</b> con el ganador y el desglose, y los botones para repetir o volver al menú."]], "s": [["Elige la alianza", "Empieza decidiendo si planificas para la <b>alianza roja o la azul</b>. Los tres robots aparecerán en la zona de inicio de ese lado."], ["Ponles nombre y país", "En la pestaña <b>Equipo</b> nombras cada robot y le asignas su país. Así sabes de un vistazo quién es quién en la cancha y en las tareas."], ["1. Empieza a grabar", "Pulsa aquí y los robots <b>vuelven solos a su zona de inicio</b>, como manda el reglamento. Desde ese momento corre el reloj de 2:30."], ["2. Mueve los robots", "Mientras grabas, <b>arrastra los robots por la cancha</b> como quieres que jueguen. Se guarda su posición 10 veces por segundo. Las Wildfire naranjas del centro son solo una referencia visual."], ["3. Detén la grabación", "El mismo botón detiene la grabación. Al hacerlo se abre sola la burbuja <b>Tasks</b>."], ["Las Tasks", "Es la <b>guía rápida de cada país</b>: qué debe hacer ese robot durante el partido. Muy útil cuando se olvidan los detalles en pleno evento. Cada uno tiene su turno de subida ya calculado y un campo libre que escribes tú. Se guarda y se exporta con la estrategia."], ["4. Orden de subida", "En <b>Escalada</b>, arrastra las filas para decidir <b>quién sube primero</b>. El primero acabará más cerca de la Suppression Unit; el último, junto al Fire Shield."], ["Zona objetivo", "Elige hasta dónde sube cada robot: CONTACT, ZONE 1, 2 o 3. Cuanto más alto, más multiplicador para toda la alianza."], ["Cuándo salir", "Con este deslizador marcas <b>a falta de cuántos segundos</b> ese robot deja de puntuar y se va al brace. Abajo ves el multiplicador que conseguirías."], ["5. Compruébala", "Pulsa <b>Reproducir</b> y verás la jugada completa; al final aparecen los braces y suben en el orden que marcaste. Si no te convence, borra las rutas y vuelve a grabar."], ["6. Guárdala", "En <b>Guardadas</b> le pones nombre y queda en <b>este dispositivo</b>. Puedes tener varias estrategias y cargar la que necesites."], ["7. Compártela", "En <b>Datos</b> la exportas como archivo JSON y se la pasas a tu equipo. Ellos la abren con <b>Importar</b> y les llega todo: rutas, tareas y plan de escalada."], ["Más espacio", "Con estos botones <b>giras la pantalla</b> entre vertical y horizontal y <b>ocultas el panel</b> para ver la cancha más grande. Para recuperarlo, toca la pestaña naranja del borde."]], "sc": [["Para qué sirve", "Aquí guardas <b>lo que sabes de cada equipo rival</b>: qué puede hacer su robot. Todo se queda en tu teléfono y luego lo compartes con tu equipo."], ["Busca el país", "Escribe y la lista se filtra al instante. Toca cualquier país para abrir su ficha y anotar lo que hayas visto en la cancha o en los pits."], ["Qué anotar", "Marca si tiene <b>Intake</b>, <b>Shooter</b> y si <b>levanta pelotas</b>. Pon en cuántos segundos trepa, cuántas pelotas dispara por segundo y si su chasis es rápido o normal. Abajo tienes notas libres para lo que no entre en esas casillas."], ["Solo lo que ya tienes", "Este filtro te deja ver únicamente los países que ya scouteaste. El número entre paréntesis es cuántos llevas."], ["Tus partidos", "En la pestaña Partidos añades tu calendario, hasta <b>15</b>. Cada uno es 3 contra 3."], ["Datos del partido", "Pon el <b>número de match</b>, en qué <b>Field</b> (del 1 al 6) y si es <b>Qualification</b> o <b>Playoff</b>. Escribes la <b>hora de Corea</b> y la de <b>Venezuela sale sola</b> (13 horas menos), avisando si cae el día anterior."], ["Quién juega", "Rellenas los tres países de la alianza roja y los tres de la azul. Junto a cada uno hay una flecha: tócala y se despliega <b>su scouting</b> ahí mismo, sin salir del partido."], ["Pásaselo al equipo", "Pulsa <b>Generar código</b> y sale un texto corto. Lo copias y lo mandas por WhatsApp al grupo."], ["Recibir de otro", "Quien reciba el código lo pega aquí y elige: <b>Combinar</b> suma lo nuevo a lo suyo sin perder nada, <b>Reemplazar</b> deja exactamente lo que venga en el código. También podéis pasarlo como archivo si preferís."]], "sf": [["Antes de cada partido", "Es tu <b>lista de seguridad</b>: lo que hay que revisar del robot antes de salir a la cancha. Viene con tres puntos básicos y tú la completas a tu gusto."], ["Ve marcando", "Toca cada punto para marcarlo. Arriba ves el <b>porcentaje</b> y la barra se llena; cuando esté todo se pone verde y te avisa de que estás listo."], ["Al terminar", "Pulsa <b>Reiniciar</b> y la lista queda limpia para el siguiente partido. Los puntos no se borran, solo se desmarcan."], ["Hazla tuya", "Con <b>Editar lista</b> cambias el texto de cualquier punto, borras los que no uses y añades los tuyos. Se guarda en este teléfono."], ["Listas ya hechas", "Si no sabes qué poner, pulsa <b>Listas recomendadas</b>: hay dos revisiones completas hechas por Team Venezuela, una para robots con <b>Shooter</b> y otra para robots con <b>Lifting</b>. Ves la lista antes de decidir, y luego la <b>añades</b> a la tuya o <b>reemplazas</b> la que tengas."], ["Pásasela a tu equipo", "En <b>Compartir</b> generas un código corto: lo copias y lo mandas por WhatsApp a quien tenga esta misma app."], ["Recibir la de otro", "Quien reciba el código lo pega aquí y elige: <b>Añadir a la mía</b> suma los puntos nuevos sin perder los suyos, o <b>Reemplazar la mía</b> deja exactamente la lista recibida."], ["Como archivo", "Si prefieres, en <b>Exportar archivo</b> la guardas como JSON y la mandas por Drive, correo o WhatsApp como documento. Quien lo reciba pulsa <b>Importar archivo</b>, elige el archivo y sus puntos se añaden a los suyos."]]}, "en": {"skip": "Skip", "done": "Start", "g": [["How many play", "Pick <b>1 player</b> against five CPUs, or <b>2 players</b> on the same screen. With two you then choose whether they are <b>allies</b> (same colour) or <b>opponents</b>."], ["Your alliance", "Choose whether you play <b>red or blue</b>. You'll unload into your colour's Suppression Unit and climb your own brace."], ["Your country and name", "Type your team name and search for your country. The <b>flag shows above your robot</b> on the field so you spot it instantly."], ["Start the match", "This button kicks it off: a 3-second countdown, the Wildfire pour out of the Extinguisher and the <b>2:30</b> begins."], ["Clock and score", "Here you follow the <b>time</b>, each alliance's points and the <b>Extinguisher</b> total, which is global: it counts the same for both sides."], ["Drive, collect and shoot", "The <b>joystick</b> moves you and the robot turns where you point. The <b>big button</b> locks a mode: <b>INTAKE</b> picks off the floor (3/s, max 25) and <b>SHOOT</b> unloads next to your Suppression Unit."], ["The Fire Shield", "Next to <b>your</b> Fire Shield the button adds one more mode: SHOOT drops there and your human player throws them into the Extinguisher, and <b>LOAD</b> hands you 6 balls every 2 s. The opposing shield is useless to you."], ["Climbing the brace", "In the <b>last 30 s</b> the braces appear. Get next to ZONE 1 of yours and <b>tap CLIMB many times in a row</b>. Stop tapping and you slip; move the joystick and you let go. The higher you get, the bigger the multiplier for your alliance."], ["Mind the queue", "The brace is <b>shared by all three robots</b> of your alliance. Climbing a free brace goes at normal speed. With <b>one robot ahead it takes twice</b> the taps, and with <b>two, over three times</b>: you have to push through. The bar under your robot turns amber or red and shows <b>x2</b> or <b>x3</b> to warn you. That's why it pays to agree who goes first instead of piling up."], ["Time's up", "At 0:00 there are <b>5 s of settling</b>: you <b>can't climb any more</b> and whatever position you're in is what counts. Then the <b>result appears over the field</b> with the winner and the breakdown, plus buttons to replay or go back to the menu."]], "s": [["Pick the alliance", "Start by choosing whether you're planning for <b>red or blue</b>. The three robots appear in that side's starting zone."], ["Name them and set countries", "In the <b>Team</b> tab you name each robot and give it a country. That's how you tell them apart on the field and in the tasks."], ["1. Start recording", "Hit this and the robots <b>snap back to their starting zone</b>, as the rules require. From that moment the 2:30 clock runs."], ["2. Move the robots", "While recording, <b>drag the robots around the field</b> the way you want them to play. Positions are saved 10 times per second. The orange Wildfire in the middle are just a visual reference."], ["3. Stop recording", "The same button stops it. When you do, the <b>Tasks</b> bubble opens by itself."], ["The Tasks", "It's the <b>quick guide for each country</b>: what that robot should do during the match. Very handy when details slip your mind mid-event. Each one already has its climb turn worked out plus a free field you write yourself. It's saved and exported with the strategy."], ["4. Climb order", "In <b>Climb</b>, drag the rows to decide <b>who goes up first</b>. The first ends up closest to the Suppression Unit; the last, next to the Fire Shield."], ["Target zone", "Choose how high each robot goes: CONTACT, ZONE 1, 2 or 3. The higher, the bigger the multiplier for the whole alliance."], ["When to leave", "This slider sets <b>how many seconds left</b> that robot stops scoring and heads for the brace. Below you see the multiplier you'd earn."], ["5. Check it", "Hit <b>Play</b> and you'll see the whole play; at the end the braces appear and they climb in the order you set. Not convinced? Clear the routes and record again."], ["6. Save it", "In <b>Saved</b> you give it a name and it stays on <b>this device</b>. You can keep several strategies and load whichever you need."], ["7. Share it", "In <b>Data</b> you export it as a JSON file and pass it to your team. They open it with <b>Import</b> and get everything: routes, tasks and climb plan."], ["More room", "These buttons <b>rotate the layout</b> between portrait and landscape and <b>hide the panel</b> so the field gets bigger. Tap the orange tab on the edge to bring it back."]], "sc": [["What it's for", "This is where you keep <b>what you know about each rival team</b>: what their robot can do. It all stays on your phone and you share it with your team afterwards."], ["Search the country", "Type and the list filters instantly. Tap any country to open its sheet and note what you saw on the field or in the pits."], ["What to note", "Tick whether it has <b>Intake</b>, <b>Shooter</b> and whether it <b>lifts balls</b>. Add how many seconds it takes to climb, how many balls per second it shoots and whether its chassis is fast or normal. Below there's a free notes field."], ["Only what you have", "This filter shows just the countries you've already scouted. The number in brackets is how many you've done."], ["Your matches", "In the Matches tab you add your schedule, up to <b>15</b>. Each one is 3 against 3."], ["Match details", "Set the <b>match number</b>, which <b>Field</b> (1 to 6) and whether it's <b>Qualification</b> or <b>Playoff</b>. You type the <b>Korea time</b> and the <b>Venezuela one comes out by itself</b> (13 hours behind), warning you if it lands on the previous day."], ["Who's playing", "Fill in the three red alliance countries and the three blue ones. Next to each there's an arrow: tap it and <b>their scouting</b> unfolds right there, without leaving the match."], ["Send it to the team", "Hit <b>Generate code</b> and you get a short text. Copy it and send it to the group on WhatsApp."], ["Receiving from someone", "Whoever gets the code pastes it here and chooses: <b>Merge</b> adds the new data to theirs without losing anything, <b>Replace</b> leaves exactly what's in the code. You can also pass it as a file."]], "sf": [["Before every match", "This is your <b>safety list</b>: what to check on the robot before going out. It comes with three basic items and you build it from there."], ["Tick as you go", "Tap each item to tick it. At the top you get the <b>percentage</b> and the bar fills up; when everything's done it turns green and tells you you're set."], ["When you're done", "Hit <b>Reset</b> and the list is clean for the next match. The items aren't deleted, just unticked."], ["Make it yours", "With <b>Edit list</b> you change any item's text, delete the ones you don't use and add your own. It's saved on this phone."], ["Ready-made lists", "Not sure what to put in? Tap <b>Recommended lists</b>: two full check routines put together by Team Venezuela, one for robots with <b>Shooter</b> and one for robots with <b>Lifting</b>. You see the list before deciding, then <b>add</b> it to yours or <b>replace</b> what you have."], ["Send it to your team", "In <b>Share</b> you generate a short code: copy it and send it by WhatsApp to anyone with this same app."], ["Getting someone else's", "Whoever receives the code pastes it here and chooses: <b>Add to mine</b> brings in the new items without losing theirs, or <b>Replace mine</b> leaves exactly the received list."], ["As a file", "If you prefer, <b>Export file</b> saves it as JSON to send via Drive, email or WhatsApp as a document. Whoever gets it taps <b>Import file</b>, picks the file and its items are added to theirs."]]}, "fr": {"skip": "Passer", "done": "Commencer", "g": [["Combien de joueurs", "Choisis <b>1 joueur</b> contre cinq CPU, ou <b>2 joueurs</b> sur le même écran. À deux, tu décides ensuite s'ils sont <b>alliés</b> ou <b>adversaires</b>."], ["Ton alliance", "Choisis si tu joues en <b>rouge ou en bleu</b>. Tu déchargeras dans la Suppression Unit de ta couleur et monteras sur ton propre brace."], ["Ton pays et ton nom", "Écris le nom de ton équipe et cherche ton pays. Le <b>drapeau apparaît au-dessus de ton robot</b> sur le terrain."], ["Lance le match", "Ce bouton démarre : compte à rebours de 3, les Wildfire sortent de l'Extinguisher et les <b>2:30</b> commencent."], ["Horloge et score", "Ici tu suis le <b>temps</b>, les points de chaque alliance et ceux de l'<b>Extinguisher</b>, globaux : ils comptent pour les deux camps."], ["Conduire, ramasser, tirer", "Le <b>joystick</b> te déplace et le robot pivote vers la direction visée. Le <b>grand bouton</b> fixe le mode : <b>INTAKE</b> ramasse au sol (3/s, max 25) et <b>SHOOT</b> décharge contre ta Suppression Unit."], ["Le Fire Shield", "Contre <b>ton</b> Fire Shield, le bouton ajoute un mode : SHOOT y dépose et ton human player les lance dans l'Extinguisher, et <b>CHARGER</b> te rend 6 balles toutes les 2 s. Le shield adverse ne sert à rien."], ["Monter au brace", "Dans les <b>30 dernières secondes</b> les braces apparaissent. Approche-toi de la ZONE 1 du tien et <b>appuie plusieurs fois de suite sur MONTER</b>. Si tu arrêtes, tu glisses ; si tu bouges le joystick, tu lâches. Plus tu montes, plus le multiplicateur est grand."], ["Attention à la file", "Le brace est <b>partagé par les trois robots</b> de ton alliance. Sur un brace libre, tu montes normalement. Avec <b>un robot devant, il faut deux fois plus</b> d'appuis, et avec <b>deux, plus du triple</b> : il faut se frayer un chemin. La barre sous ton robot passe à l'ambre ou au rouge et affiche <b>x2</b> ou <b>x3</b>. D'où l'intérêt de décider à l'avance qui monte en premier."], ["Temps écoulé", "À 0:00 il y a <b>5 s de stabilisation</b> : tu <b>ne peux plus monter</b> et c'est ta position qui compte. Ensuite le <b>résultat s'affiche sur le terrain</b> avec le vainqueur et le détail, plus les boutons pour rejouer ou revenir au menu."]], "s": [["Choisis l'alliance", "Commence par décider si tu planifies pour le <b>rouge ou le bleu</b>. Les trois robots apparaissent dans la zone de départ de ce côté."], ["Noms et pays", "Dans l'onglet <b>Équipe</b>, tu nommes chaque robot et lui donnes un pays. C'est ainsi que tu les distingues sur le terrain et dans les tâches."], ["1. Démarre l'enregistrement", "Appuie ici et les robots <b>reviennent à leur zone de départ</b>, comme l'exige le règlement. L'horloge de 2:30 démarre alors."], ["2. Déplace les robots", "Pendant l'enregistrement, <b>fais glisser les robots sur le terrain</b> comme tu veux qu'ils jouent. Les positions sont enregistrées 10 fois par seconde."], ["3. Arrête l'enregistrement", "Le même bouton l'arrête. La bulle <b>Tasks</b> s'ouvre alors toute seule."], ["Les Tasks", "C'est le <b>guide rapide de chaque pays</b> : ce que ce robot doit faire pendant le match. Très utile quand les détails t'échappent en plein événement. Chacun a déjà son tour de montée calculé, plus un champ libre que tu écris. C'est enregistré et exporté avec la stratégie."], ["4. Ordre de montée", "Dans <b>Montée</b>, fais glisser les lignes pour décider <b>qui monte en premier</b>. Le premier finit le plus près de la Suppression Unit ; le dernier, près du Fire Shield."], ["Zone visée", "Choisis jusqu'où monte chaque robot : CONTACT, ZONE 1, 2 ou 3. Plus haut, plus grand le multiplicateur pour toute l'alliance."], ["Quand partir", "Ce curseur fixe <b>à combien de secondes</b> ce robot arrête de marquer et part vers le brace. En dessous, le multiplicateur prévu."], ["5. Vérifie-la", "Appuie sur <b>Lire</b> et tu verras toute l'action ; à la fin les braces apparaissent et ils montent dans l'ordre prévu. Pas convaincu ? Efface et recommence."], ["6. Enregistre-la", "Dans <b>Sauvegardes</b>, tu lui donnes un nom et elle reste sur <b>cet appareil</b>. Tu peux en garder plusieurs."], ["7. Partage-la", "Dans <b>Données</b>, tu l'exportes en JSON pour ton équipe. Ils l'ouvrent avec <b>Importer</b> et reçoivent tout : trajets, tâches et plan de montée."], ["Plus de place", "Ces boutons <b>font pivoter la mise en page</b> et <b>masquent le panneau</b> pour agrandir le terrain. Touche l'onglet orange du bord pour le ramener."]], "sc": [["À quoi ça sert", "C'est ici que tu gardes <b>ce que tu sais de chaque équipe adverse</b> : ce que son robot sait faire. Tout reste sur ton téléphone et tu le partages ensuite avec ton équipe."], ["Cherche le pays", "Tape et la liste se filtre aussitôt. Touche un pays pour ouvrir sa fiche et noter ce que tu as vu sur le terrain ou aux pits."], ["Quoi noter", "Coche s'il a un <b>Intake</b>, un <b>Shooter</b> et s'il <b>soulève des balles</b>. Indique en combien de secondes il monte, combien de balles par seconde il tire et si son châssis est rapide ou normal. En dessous, des notes libres."], ["Seulement ce que tu as", "Ce filtre n'affiche que les pays déjà scoutés. Le nombre entre parenthèses, c'est combien tu en as."], ["Tes matchs", "Dans l'onglet Matchs tu ajoutes ton calendrier, jusqu'à <b>15</b>. Chacun est 3 contre 3."], ["Détails du match", "Mets le <b>numéro de match</b>, le <b>Field</b> (de 1 à 6) et si c'est <b>Qualification</b> ou <b>Playoff</b>. Tu saisis l'<b>heure de Corée</b> et celle du <b>Venezuela sort toute seule</b> (13 heures de moins), en signalant si c'est la veille."], ["Qui joue", "Remplis les trois pays de l'alliance rouge et les trois de la bleue. À côté de chacun, une flèche : touche-la et <b>son scouting</b> se déplie sur place."], ["Envoie-le à l'équipe", "Appuie sur <b>Générer un code</b> et tu obtiens un texte court. Copie-le et envoie-le au groupe WhatsApp."], ["Recevoir d'un autre", "Celui qui reçoit le code le colle ici et choisit : <b>Fusionner</b> ajoute le nouveau au sien sans rien perdre, <b>Remplacer</b> ne garde que ce qui est dans le code."]], "sf": [["Avant chaque match", "C'est ta <b>liste de sécurité</b> : ce qu'il faut vérifier sur le robot avant d'y aller. Elle arrive avec trois points de base, à toi de la compléter."], ["Coche au fur et à mesure", "Touche chaque point pour le cocher. En haut, le <b>pourcentage</b> et la barre qui se remplit ; quand tout est fait, elle passe au vert."], ["À la fin", "Appuie sur <b>Réinitialiser</b> et la liste est propre pour le match suivant. Les points ne sont pas supprimés, juste décochés."], ["Personnalise-la", "Avec <b>Modifier la liste</b> tu changes le texte, supprimes ce qui ne sert pas et ajoutes les tiens. C'est enregistré sur ce téléphone."], ["Des listes toutes prêtes", "Tu ne sais pas quoi mettre ? Appuie sur <b>Listes recommandées</b> : deux vérifications complètes faites par Team Venezuela, une pour les robots avec <b>Shooter</b> et une pour ceux avec <b>Lifting</b>. Tu vois la liste avant de choisir, puis tu l'<b>ajoutes</b> à la tienne ou tu <b>remplaces</b> la tienne."], ["Envoie-la à ton équipe", "Dans <b>Partager</b> tu génères un code court : copie-le et envoie-le par WhatsApp à qui a la même app."], ["Recevoir celle d'un autre", "Celui qui reçoit le code le colle ici et choisit : <b>Ajouter à la mienne</b> intègre les nouveaux points, ou <b>Remplacer la mienne</b> ne garde que la liste reçue."], ["En fichier", "Si tu préfères, <b>Exporter le fichier</b> l'enregistre en JSON pour l'envoyer par Drive, mail ou WhatsApp. Le destinataire appuie sur <b>Importer un fichier</b>, choisit le fichier et ses points s'ajoutent aux siens."]]}, "pt": {"skip": "Saltar", "done": "Começar", "g": [["Quantos jogam", "Escolhe <b>1 jogador</b> contra cinco CPU, ou <b>2 jogadores</b> no mesmo ecrã. Com dois decides depois se vão <b>aliados</b> ou <b>adversários</b>."], ["A tua aliança", "Escolhe se jogas em <b>vermelho ou azul</b>. Vais descarregar na Suppression Unit da tua cor e subir o teu brace."], ["O teu país e nome", "Escreve o nome da tua equipa e procura o teu país. A <b>bandeira aparece por cima do teu robô</b> no campo."], ["Inicia a partida", "Este botão lança a partida: contagem de 3, as Wildfire saem do Extinguisher e começam os <b>2:30</b>."], ["Relógio e marcador", "Aqui segues o <b>tempo</b>, os pontos de cada aliança e os do <b>Extinguisher</b>, que são globais: contam igual para os dois lados."], ["Conduzir, apanhar e disparar", "Com o <b>joystick</b> moves-te e o robô roda para onde apontas. O <b>botão grande</b> fixa o modo: <b>INTAKE</b> apanha do chão (3/s, máx. 25) e <b>SHOOT</b> descarrega junto à tua Suppression Unit."], ["O Fire Shield", "Junto ao <b>teu</b> Fire Shield o botão acrescenta outro modo: SHOOT deposita ali e o teu human player lança-as para o Extinguisher, e <b>CARREGAR</b> devolve-te 6 bolas a cada 2 s. O shield adversário não te serve."], ["Subir ao brace", "Nos <b>últimos 30 s</b> aparecem os braces. Aproxima-te da ZONE 1 do teu e <b>carrega muitas vezes seguidas em SUBIR</b>. Se parares escorregas; se moveres o joystick soltas-te. Quanto mais alto, maior o multiplicador."], ["Cuidado com a fila", "O brace é <b>partilhado pelos três robôs</b> da tua aliança. Com o brace livre sobes normal. Com <b>um robô à frente custa o dobro</b> dos toques, e com <b>dois, mais do triplo</b>: tens de abrir caminho. A barra sob o teu robô fica âmbar ou vermelha e mostra <b>x2</b> ou <b>x3</b>. Por isso vale a pena decidir antes quem sobe primeiro."], ["Acabou o tempo", "Aos 0:00 há <b>5 s a assentar</b>: já <b>não podes subir mais</b> e conta a posição em que ficaste. Depois aparece o <b>resultado sobre o campo</b> com o vencedor e o detalhe, e os botões para repetir ou voltar ao menu."]], "s": [["Escolhe a aliança", "Começa por decidir se planeias para a <b>aliança vermelha ou azul</b>. Os três robôs aparecem na zona de início desse lado."], ["Nomes e países", "No separador <b>Equipa</b> dás nome a cada robô e atribuis-lhe um país. Assim sabes num relance quem é quem no campo e nas tarefas."], ["1. Começa a gravar", "Carrega aqui e os robôs <b>voltam sozinhos à zona de início</b>, como manda o regulamento. A partir daí corre o relógio de 2:30."], ["2. Move os robôs", "Enquanto gravas, <b>arrasta os robôs pelo campo</b> como queres que joguem. A posição é guardada 10 vezes por segundo."], ["3. Pára a gravação", let TOUR={on:false,i:0,steps:[],kind:'g'};
const tourEl=document.getElementById('tour'),tourHole=document.getElementById('tourHole'),
tourBox=document.getElementById('tourBox'),tTitle=document.getElementById('tTitle'),
tText=document.getElementById('tText'),tStep=document.getElementById('tStep'),
tPrev=document.getElementById('tPrev'),tNext=document.getElementById('tNext'),tSkip=document.getElementById('tSkip');
function tourTexts(){const d=TOUR_TXT[LANG]||TOUR_TXT.en;return d[TOUR.kind]}
function startTour(kind){
if(kind==='g'){
if(S.game.phase!=='setup'){S.game.phase='setup';S.game.result=null;hideControls()}
S.game.tab='partido';
}else if(kind==='s'){
S.strat.tab='equipo';
if(S.strat.recording)stopRec();
S.strat.phase='idle';
}else if(kind==='sc'){
S.scout.tab='perfiles';S.scout.open=null;S.scout.q='';S.scout.onlyData=false;
}else if(kind==='sf'){
S.safety.edit=false;
}
renderPanel();
TOUR.kind=kind;
TOUR.steps=(kind==='g')?TOUR_GAME:(kind==='s')?TOUR_STRAT:(kind==='sc')?TOUR_SCOUT:TOUR_SAFE;
TOUR.i=0;TOUR.on=true;
if(S.mode==='scout')renderPanel();
tourEl.classList.remove('hide');
setTimeout(()=>tourStep(0),60);
}
function endTour(){TOUR.on=false;tourEl.classList.add('hide')}
function tourStep(i){
if(window.resetCompact)window.resetCompact();
const st=TOUR.steps,n=st.length;
if(i<0)i=0;
if(i>=n){endTour();return}
TOUR.i=i;
const step=st[i];
if(step.tab&&S.mode==='strategy'&&S.strat.tab!==step.tab){S.strat.tab=step.tab;renderPanel()}
if(step.tab&&S.mode==='scout'&&S.scout.tab!==step.tab){S.scout.tab=step.tab;S.scout.open=null;renderPanel()}
if(step.tab&&S.mode==='safety'&&S.safety.tab!==step.tab){S.safety.tab=step.tab;renderPanel()}
if(step.pre){try{step.pre()}catch(e){}}
if(!step.pre&&S.mode==='strategy'&&step.sel!=='#tasksBubble'&&LAY==='v')bubble.classList.add('hide');
const d=(TOUR_TXT[LANG]||TOUR_TXT.en);
const txt=tourTexts()[i]||['',''];
tTitle.innerHTML=txt[0];tText.innerHTML=txt[1];
tStep.textContent=(i+1)+'/'+n;
tPrev.disabled=(i===0);
tNext.textContent=(i===n-1)?d.done:'›';
tSkip.textContent=d.skip;
tourScroll(step,()=>{tourPlace(step);setTimeout(()=>{if(TOUR.on&&TOUR.steps[TOUR.i]===step)tourPlace(step)},150)});
}
function tourScroll(step,cb){
let el=null;
try{el=document.querySelector(step.sel)}catch(e){}
if(el){
const box=el.closest('.pbody')||el.closest('#tasksBubble')||el.closest('#rail');
if(box){
const br=box.getBoundingClientRect(),er=el.getBoundingClientRect();
if(er.top<br.top+8||er.bottom>br.bottom-8){
box.scrollTop+=(er.top-br.top)-(br.height/2-er.height/2);
}
}
}
requestAnimationFrame(()=>requestAnimationFrame(cb));
}
function tourPlace(step){
let el=null;
try{el=document.querySelector(step.sel)}catch(e){}
const vw=innerWidth,vh=innerHeight;
let r;
if(el&&el.getBoundingClientRect().width>4){
const b=el.getBoundingClientRect();
const pad=8;
r={x:Math.max(4,b.left-pad),y:Math.max(4,b.top-pad),
w:Math.min(vw-8,b.width+pad*2),h:Math.min(vh-8,b.height+pad*2)};
}else{
r={x:vw*0.25,y:vh*0.32,w:vw*0.5,h:vh*0.3};
}
tourHole.style.left=r.x+'px';tourHole.style.top=r.y+'px';
tourHole.style.width=r.w+'px';tourHole.style.height=r.h+'px';
tourHole.classList.add('pulse');
tourBox.style.maxHeight=Math.max(150,vh-16)+'px';
const bw=tourBox.offsetWidth||320;
let bh=tourBox.offsetHeight||190;
if(bh>vh-16){bh=vh-16}
let bx=r.x+r.w/2-bw/2,by;
const below=r.y+r.h+12,above=r.y-bh-12;
if(below+bh<=vh-8)by=below;
else if(above>=8)by=above;
else by=Math.max(8,Math.min(Math.max(8,vh-bh-8),r.y+r.h/2-bh/2));
by=Math.max(8,Math.min(Math.max(8,vh-bh-8),by));
bx=Math.max(8,Math.min(Math.max(8,vw-bw-8),bx));
tourBox.style.left=bx+'px';tourBox.style.top=by+'px';
}
tPrev.onclick=()=>tourStep(TOUR.i-1);
tNext.onclick=()=>tourStep(TOUR.i+1);
tSkip.onclick=endTour;
document.getElementById('tClose').onclick=endTour;
document.getElementById('tourDim').onclick=()=>tourStep(TOUR.i+1);
addEventListener('resize',()=>{if(TOUR.on)tourPlace(TOUR.steps[TOUR.i])});
addEventListener('keydown',e=>{
if(!TOUR.on)return;

if(e.key==='ArrowRight')tourStep(TOUR.i+1);

});

function mSize(m){return m&&m.type==='p'?4:3}
function fitMatch(m){
const n=mSize(m);
['red','blue'].forEach(k=>{
if(!Array.isArray(m[k]))m[k]=[];
while(m[k].length<n)m[k].push('');
if(m[k].length>n)m[k]=m[k].slice(0,n);
});
return m;
}
function newMatch(){
return{id:Date.now()+Math.floor(Math.random()*999),no:'',field:1,type:'q',kst:'09:00',
red:['','',''],blue:['','','']};

function veTime(kst){
if(!/^\d{1,2}:\d{2}$/.test(kst||''))return{s:'--:--',prev:false};
const p0=kst.split(':'),h=+p0[0],m=+p0[1];
let v=h-13,prev=false;
if(v<0){v+=24;prev=true}
return{s:String(v).padStart(2,'0')+':'+String(m).padStart(2,'0'),prev:prev};
}

"us virgin islands":"united states virgin islands","u s virgin islands":"united states virgin islands",
"hong kong china":"hong kong, china","hope refugees":"hope","chinese taipei":"chinese taipei",

"syrian arab republic":"syria","islamic republic of iran":"iran","cabo verde":"cape verde",
"federated states of micronesia":"micronesia","democratic republic of the congo":"dr congo"};
function scNorm(s){
let x=String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
.replace(/[`'\u2019.,()]/g,'').replace(/\s+/g,' ').trim();
if(SC_ALIAS[x])x=SC_ALIAS[x];
return x;
}
let FLAGN=null;
function flagByName(name){
if(!FLAGN){FLAGN={};FLAGS.forEach((f,i)=>{FLAGN[scNorm(f.n)]=i})}
const q=scNorm(name);
if(q in FLAGN)return FLAGN[q];
let best=-1;
for(const k in FLAGN){
if(k===q)return FLAGN[k];
if(k.indexOf(q)===0||q.indexOf(k)===0){best=FLAGN[k];break}
}
if(best<0)for(const k in FLAGN){if(k.indexOf(q)>=0||q.indexOf(k)>=0){best=FLAGN[k];break}}
return best;
}
function codeToCountry(code){
const n=IOC[String(code||'').toUpperCase()];
if(!n)return null;
const i=flagByName(n);
return i>=0?FLAGS[i].n:null;
}
function parseRankText(txt){
const out=[];
String(txt||'').split(/\r?\n/).forEach(line=>{
const l=line.trim();
if(!l)return;
let p=l.split('\t').map(x=>x.trim()).filter(x=>x!=='');
if(p.length<3)p=l.split(/\s{2,}/).map(x=>x.trim()).filter(x=>x!=='');
if(p.length<3){
const m=l.match(/^(\d{1,3})\s+(.+?)\s+(\d+(?:[.,]\d+)?)(?:\s+\S+)*$/);
if(!m)return;
p=[m[1],m[2],m[3]];
}
const r=parseInt(p[0],10);
if(!r||r>400)return;
const name=p[1];
if(!name||/^\d/.test(name))return;
const sc=parseFloat(String(p[2]).replace(',','.'));
const idx=flagByName(name);
out.push({r:r,n:idx>=0?FLAGS[idx].n:name,raw:name,s:isFinite(sc)?sc:null,ok:idx>=0});
});
return out;
}
function parseMatchText(txt){
const out=[];let cur=null;
String(txt||'').split(/\r?\n/).forEach(line=>{
const l=line.trim();
if(!l)return;
const m=l.match(/match\s*(\d+)/i);
if(m){if(cur&&cur.codes.length)out.push(cur);cur={n:parseInt(m[1],10),label:l,codes:[],sc:[]};return}
if(!cur)return;
if(/^[A-Za-z]{3}$/.test(l)){cur.codes.push(l.toUpperCase());return}
if(/^\d{1,3}$/.test(l)){cur.sc.push(parseInt(l,10));return}
});
if(cur&&cur.codes.length)out.push(cur);
return out.map(m=>{
const h=Math.floor(m.codes.length/2)||3;
return{n:m.n,label:m.label,red:m.codes.slice(0,h),blue:m.codes.slice(h,h*2),sc:m.sc.slice(-2)};
});
}

function b64enc(u8){let s0='';for(let i=0;i<u8.length;i++)s0+=String.fromCharCode(u8[i]);return btoa(s0)}
function b64dec(str){const bin=atob(str);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return u8}
async function packScout(){
const payload=JSON.stringify({p:S.scout.profiles,m:S.scout.matches});
const bytes=new TextEncoder().encode(payload);
if(typeof CompressionStream!=='undefined'){
try{
const cs=new CompressionStream('deflate-raw');
const w=cs.writable.getWriter();w.write(bytes);w.close();
const buf=await new Response(cs.readable).arrayBuffer();
return 'IGS1:'+b64enc(new Uint8Array(buf));
}catch(e){}
}
return 'IGS0:'+b64enc(bytes);
}
async function unpackScout(code){
code=(code||'').trim().replace(/\s+/g,'');
if(code.indexOf('IGS1:')===0){
const u8=b64dec(code.slice(5));
const ds=new DecompressionStream('deflate-raw');
const w=ds.writable.getWriter();w.write(u8);w.close();
const buf=await new Response(ds.readable).arrayBuffer();
return JSON.parse(new TextDecoder().decode(buf));
}
if(code.indexOf('IGS0:')===0)return JSON.parse(new TextDecoder().decode(b64dec(code.slice(5))));
return JSON.parse(code);
}
function applyScout(d,merge){
if(!d||typeof d!=='object')throw new Error('bad');
const P=d.p||{},M=Array.isArray(d.m)?d.m:[];
if(merge){
for(const k in P)S.scout.profiles[k]=Object.assign(S.scout.profiles[k]||blankProfile(),P[k]);
M.forEach(m=>{if(!S.scout.matches.some(x=>x.id===m.id))S.scout.matches.push(m)});
S.scout.matches=S.scout.matches.slice(0,15);
}else{
S.scout.profiles=P;S.scout.matches=M.slice(0,15);
}
saveScout();S.scout.code='';renderPanel();
alert(t('scImported'));
}
async function doImport(txt,merge){
try{const d=await unpackScout(txt);applyScout(d,merge)}
catch(e){alert(t('scBadCode'))}
}

if(!clean.length)throw new Error('bad');
if(merge){
clean.forEach(txt=>{if(!S.safety.items.some(i=>i.t===txt))S.safety.items.push({t:txt,done:false})});
}else{
S.safety.items=clean.map(txt=>({t:txt,done:false}));
}
saveSafety();S.safety.code='';S.safety.tab='lista';renderPanel();
alert(t('sfImported'));
}
async function doSafetyImport(txt,merge){
try{applySafety(await unpackSafety(txt),merge)}catch(e){alert(t('sfBadCode'))}
}

function setStartFab(on){
const b=document.getElementById('startFab');

b.textContent=t('startMatch');
b.classList.toggle('on',!!on);
}

(function(){
const btnTop=document.getElementById('btnTop');
let compact=false;
const SK=0.62;
function sizeStage(){
const st=document.getElementById('stage');
if(!st)return;
const prev=document.body.classList.contains('compact');
if(prev)document.body.classList.remove('compact');
const h=st.getBoundingClientRect().height;
if(prev)document.body.classList.add('compact');
document.body.style.setProperty('--sk',SK);
document.body.style.setProperty('--stageCut',(-Math.round(h*(1-SK)))+'px');
}
function setCompact(on){
on=!!on;
if(on===compact)return;
compact=on;
if(compact)sizeStage();
document.body.classList.toggle('compact',compact);
btnTop.classList.toggle('on',compact);
}
addEventListener('resize',()=>{if(compact)sizeStage()});
window.resetCompact=function(){if(compact)setCompact(false)};
let lock=0;
function canScroll(){return pbody.scrollHeight-pbody.clientHeight>40}
pbody.addEventListener('scroll',()=>{
if(typeof TOUR!=='undefined'&&TOUR&&TOUR.on)return;
if(document.body.classList.contains('nopanel'))return;
if(Date.now()<lock)return;
const y=pbody.scrollTop;
if(!compact){if(y>70&&canScroll()){lock=Date.now()+420;setCompact(true)}}
else if(y<=2&&canScroll()){lock=Date.now()+420;setCompact(false)}
},{passive:true});
btnTop.onclick=()=>{
lock=0;setCompact(false);
try{pbody.scrollTo({top:0,behavior:'smooth'})}catch(e){pbody.scrollTop=0}
};
})();
(function(){
const origRender=renderPanel;
let lastKey='';
function viewKey(){
try{
if(S.mode==='strategy')return 'strategy|'+S.strat.tab;
if(S.mode==='scout')return 'scout|'+S.scout.tab;
if(S.mode==='safety')return 'safety|'+S.safety.tab;
if(S.mode==='game')return 'game|'+(g?g.tab:'')+'|'+(g?!!g.running:'');
}catch(e){}
return String(S.mode);
}
renderPanel=function(){
setStartFab(false);
const key=viewKey();
const keep=(key===lastKey&&!!pbody);
if(!keep&&window.resetCompact)window.resetCompact();
const y=keep?pbody.scrollTop:0;
const r=origRender.apply(this,arguments);
lastKey=key;
if(keep){
pbody.scrollTop=y;
requestAnimationFrame(()=>{if(viewKey()===key)pbody.scrollTop=y});
}
return r;
};
})();
